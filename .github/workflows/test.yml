name: Test File

on:
  pull_request:
    branches: 
      - backend
  workflow_dispatch:

permissions: 
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v7
      - name: build
        run: |
          cd backend
          npm install
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:  
            name: build
            path: backend/
  deploy:
    needs: build
    # environment: development
    runs-on: ubuntu-latest
    steps:
        - uses: actions/download-artifact@v8
          with:
            name: build
            path: .
        - uses: JorgeLNJunior/render-deploy@v1.5.0
          with:
            service_id: ${{secrets.RENDER_SERVICE}}
            api_key: ${{secrets.RENDER_API}}

  
          
          
        
        
      
        
      
