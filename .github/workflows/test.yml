name: Test File

on:
  pull_request:
    branches: 
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v7
      - name: build
        run: |
          cd frontend
          npm install
      - name: upload artifact
        uses: artifact/upload-artifact@v7
        with:  
            name: build
            path: frontend/
      
        
      
