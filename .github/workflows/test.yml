name: Test File

on:
  pull_request:
    branches: 
      - main
  workflow_dispatch:

permissions: 
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v7
      - name: build
        run: |
          cd backend
          npm install
      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:  
            name: build
            path: backend/
  
          
          
        
        
      
        
      
