# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  push:
    branches: ["main"]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
         mkdir files
      - name: Build frontend package
        working-directory: frontend
        run: |
           touch .env
           echo "VITE_SUPABASE_KEY=${{secrets.VITE_SUPABASE_KEY}}">>.env
           echo "VITE_GOOGLE_KEY=${{secrets.VITE_GOOGLE_KEY}}">>.env
           echo "VITE_SUPABASE_URL=${{secrets.VITE_SUPABASE_URL}}">>.env
           npm install
           npm run build
           cp dist /files
      - name: Build backend package
        working-directory: backend
        run: |
         touch .env
         echo "publishable_key=${{secrets.PUBLISHABLE_KEY}}">>.env
         echo "secret_key=${{secrets.SECRET_KEY}}">>.env
         echo "url=${{secrets.URL}}">>.env
         echo "endPoint=${{secrets.ENDPOINT}}">>.env
         echo "port=${{secrets.PORT}}">>.env
         echo "accessKey=${{secrets.ACCESSKEY}}">>.env
         echo "secretKey=${{secrets.SECRETKEY}}">>.env
         echo "frontend_url=${{secrets.FRONTEND_URL}}">>.env
         echo "docker_ps=${{secrets.DOCKERPS}}">>.env
         npm install
      - run: |
          cp -r backend files
      - name: Upload Package
        if: success()
        uses: actions/upload-artifact@v4
        with:
           name: frontend_artifact
           path: /files
           
  deploy:
   needs: build
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v4
     - uses: actions/download-artifact@v4
       with:
         name: frontend_artifact
         path: ./build_frontend
     - uses: Azure/static-web-apps-deploy@v1
       with:
         azure_static_web_apps_api_token: ${{ secrets.AZURE_TOKEN }}
         action: "upload"
         app_location: "./build_frontend/dist"
         api_location: "" 
         output_location: ""
     - uses: azure/webapps-deploy@v3
       with:
         publish-profile: ${{secrets.WEBAPP_PROFILE}}
         app-name: "westus"
         package: "./build_frontend/backend"
         

        
        
     
    
   
   
        

