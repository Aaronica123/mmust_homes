services:
  container_1:
    build: "./backend"
    dockerfile: "Dockerfile"
    ports:
      - 3001:3001
    networks:
      - mmust_homes_networks
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl","-f","http://localhost:3001"]
      interval: 1m30s
      timeout: 15s
      retries: 5
      start_period: 30s
  frontend_container:
    build: "/frontend"
    dockerfile: Dockerfile
    ports:
      - 8001:8001
    networks:
      - mmust_homes_networks
    env_file:
      - .env
    depends_on:
      - container_1:
          condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-f", "http://localhost:8001"]
      interval: 1m30s
      timeout: 15s
      retries: 5
      start_period: 30s

networks:
  mmust_homes_networks:
    driver: "bridge"